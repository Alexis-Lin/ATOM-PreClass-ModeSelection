<title>Mode menu — capability switches</title>
<style>
  :root{--bg:#e9eae6;--ink:#16181a;--ink-2:#6a6f74;--ink-3:#9ba0a5;--line:#e6e8e2;--hair:#eef0eb;--brand:#7cc00c;--brand-ink:#4f7d05;--brand-tint:#eef7df;--plus:#a9812f;--plus-bg:#f6f1e6;--plus-line:#ece2cc;--card:#fff;--cta:#141414;--iconbg:#f2f3ef;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:var(--font);-webkit-font-smoothing:antialiased;color:var(--ink);}
  .wrap{max-width:430px;margin:0 auto;padding:20px 16px 40px;}
  .ctl{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:14px;}
  .ctl button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:999px;cursor:pointer;}
  .ctl button[aria-pressed="true"]{background:var(--cta);color:#fff;}
  .phone{background:#fff;border-radius:30px;box-shadow:0 22px 60px -30px rgba(20,26,20,.5);border:1px solid rgba(0,0,0,.06);overflow:hidden;}
  .scr{padding:18px 16px;display:flex;flex-direction:column;gap:13px;}
  .scr h2{font-size:19px;font-weight:800;margin:2px 2px 0;}
  .dev{display:flex;align-items:center;gap:8px;padding:0 2px 11px;border-bottom:1px solid var(--hair);}
  .dev .hw{width:24px;height:24px;border-radius:7px;background:var(--brand-tint);color:var(--brand-ink);display:grid;place-items:center;}
  .dev .hw svg{width:15px;height:15px;} .dev .dn{font-size:14px;font-weight:800;}
  .dev .st{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--brand-ink);} .dev .st svg{width:14px;height:14px;}

  .card{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;transition:.16s;}
  .card.manual{background:#fafbf8;border-color:var(--line);}
  .chead{display:flex;align-items:center;gap:11px;padding:14px 13px;}
  .chead .ic{width:42px;height:42px;border-radius:11px;background:var(--brand-tint);color:var(--brand-ink);display:grid;place-items:center;flex:none;transition:.16s;}
  .card.manual .chead .ic{background:var(--iconbg);color:#2c2f31;} .chead .ic svg{width:23px;height:23px;}
  .chead .nm{flex:1;} .chead .row1{display:flex;align-items:center;gap:7px;} .chead .name{font-size:16px;font-weight:800;letter-spacing:-.01em;}
  .chead .sub{font-size:12px;color:var(--ink-2);margin-top:2px;line-height:1.4;}
  .plus{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;color:var(--plus);background:var(--plus-bg);border:1px solid var(--plus-line);border-radius:4px;padding:1px 5px 1px 4px;} .plus svg{width:9px;height:9px;}

  .caprow{display:flex;align-items:center;gap:11px;padding:13px;border-top:1px solid var(--hair);}
  .caprow .ci{width:30px;height:30px;border-radius:8px;background:var(--iconbg);color:#2c2f31;display:grid;place-items:center;flex:none;} .caprow .ci svg{width:17px;height:17px;}
  .caprow .cl{flex:1;} .caprow .cn{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;} .caprow .cs{font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.4;}
  .capeye{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px;}
  .cchip{font-size:9px;font-weight:700;color:var(--brand-ink);background:var(--brand-tint);border-radius:4px;padding:1px 5px;display:inline-flex;align-items:center;gap:3px;} .cchip svg{width:9px;height:9px;}
  .caprow.off .cn,.caprow.off .cs,.caprow.off .ci{opacity:.5;}
  .sw{position:relative;width:44px;height:26px;border-radius:999px;background:#cdd0ca;cursor:pointer;transition:.18s;flex:none;}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .sw.on{background:var(--brand);} .sw.on::after{transform:translateX(18px);}

  .status{display:flex;align-items:center;gap:8px;padding:12px 13px;background:var(--brand-tint);border-top:1px solid var(--hair);font-size:13px;font-weight:700;color:var(--brand-ink);}
  .card.manual .status{background:#f1f2ee;color:var(--ink-2);}
  .status svg{width:16px;height:16px;flex:none;}

  .mnote{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--ink-2);line-height:1.45;background:#f4f5f2;border:1px solid var(--line);border-radius:9px;padding:10px 11px;}
  .mnote svg{width:15px;height:15px;flex:none;margin-top:1px;color:var(--ink-3);}
  .cloud{display:flex;gap:7px;align-items:flex-start;font-size:11px;color:var(--ink-3);line-height:1.4;padding:0 2px;} .cloud svg{width:13px;height:13px;flex:none;margin-top:1px;}
  .cta{background:var(--cta);color:#fff;border:0;border-radius:999px;padding:16px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;}
  footer{margin-top:16px;font-size:11.5px;color:var(--ink-3);text-align:center;line-height:1.5;}
</style>
<script>
  var IC={
    ai:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.4"/><path d="M8 3v3M16 3v3"/></svg>',
    hand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 13V7.4a1.4 1.4 0 0 1 2.8 0V12"/><path d="M12.3 12V6.4a1.4 1.4 0 0 1 2.8 0V12"/><path d="M15.1 12.2V8.4a1.4 1.4 0 0 1 2.8 0V16a5.6 5.6 0 0 1-5.6 5.6h-1.3a5.6 5.6 0 0 1-4.5-2.3l-2.1-2.9a1.45 1.45 0 0 1 2.35-1.75l1.3 1.55"/><path d="M4.6 8.9l3.3-3.3 1.35 1.35-3.3 3.3-1.85.5.5-1.85Z"/></svg>',
    live:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h3l5 4V5L7 9H4Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a9 9 0 0 1 0 12"/></svg>',
    rec:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="12" height="10" rx="2.4"/><path d="M15 10.2l5.5-2.7v9l-5.5-2.7"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l5 5-5 13L7 8l5-5Z"/><path d="M7 8h10"/></svg>',
    wifi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><path d="M12 18.5h.01"/></svg>',
    hw:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.4"/></svg>',
    play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5l11 7-11 7Z"/></svg>',
    cloud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-7.97 5 5 0 0 1 9.6-1.3A3.5 3.5 0 0 1 17.5 18H7Z"/></svg>',
    info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5h.01"/></svg>'
  };
  var L={
    en:{title:'Select mode',connected:'Connected',name:'AI Coach',sub:'Two independent switches — both on by default.',
      liveEye:'During your set',recEye:'After your workout',cloudChip:'Cloud',
      liveN:'Live coaching',liveS:'Real-time rep counting and form cues while you train.',
      recN:'Record & report',recS:'Records your workout; the cloud turns it into your report.',
      manualName:'Manual',manualSub:'No camera — log it yourself.',
      manualNote:'Both switches off = Manual: log sets, reps & weight yourself. No camera or Plus needed.',
      s_full:'Full AI coaching — live cues + report',
      s_recap:'Record & Recap — silent, report after',
      s_live:'Live coaching only — nothing is saved',
      s_manual:'Manual — you log it yourself',
      cta_coach:'Start Coaching',cta_rec:'Start Recording',cta_manual:'Start Logging',
      foot:'Both on by default. Turn both off and it becomes Manual.'},
    zh:{title:'选择上课模式',connected:'已连接',name:'AI 教练',sub:'两个独立开关，默认都开。',
      liveEye:'课中',recEye:'课后',cloudChip:'云端',
      liveN:'实时指导',liveS:'训练时实时计数、动作提示。',
      recN:'录制与报告',recS:'全程录制，云端分析生成课后报告。',
      manualName:'手动',manualSub:'无需摄像头，自己记录。',
      manualNote:'两个开关都关 = 手动模式：自己记录组数/次数/重量，无需摄像头或 Plus。',
      s_full:'完整 AI 教练——实时提示 + 报告',
      s_recap:'录制与复盘——安静记录，练后出报告',
      s_live:'仅实时指导——不留存录像/报告',
      s_manual:'手动——自己记录',
      cta_coach:'开始指导',cta_rec:'开始录制',cta_manual:'开始记录',
      foot:'两个默认都开。两个都关，就变成手动模式。'}
  };
</script>

<div class="wrap">
  <div class="ctl" id="lang"><button data-l="en" aria-pressed="true">EN</button><button data-l="zh" aria-pressed="false">中文</button></div>
  <div class="phone"><div class="scr">
    <h2 data-t="title"></h2>
    <div class="dev"><span class="hw"></span><span class="dn">ATOM 449C</span><span class="st"></span></div>

    <div class="card" id="card">
      <div class="chead">
        <div class="ic" id="c-ic"></div>
        <div class="nm"><div class="row1"><span class="name" id="c-name"></span><span class="plus" id="c-plus"><span data-ic="plus"></span>Plus</span></div><div class="sub" id="c-sub"></div></div>
      </div>
      <div class="caprow" id="row-live">
        <div class="ci" data-ic="live"></div>
        <div class="cl"><div class="capeye" data-t="liveEye"></div><div class="cn" data-t="liveN"></div><div class="cs" data-t="liveS"></div></div>
        <div class="sw on" data-sw="live"></div>
      </div>
      <div class="caprow" id="row-rec">
        <div class="ci" data-ic="rec"></div>
        <div class="cl"><div class="capeye" data-t="recEye"></div><div class="cn"><span data-t="recN"></span><span class="cchip"><span data-ic="cloud"></span><span data-t="cloudChip"></span></span></div><div class="cs" data-t="recS"></div></div>
        <div class="sw on" data-sw="rec"></div>
      </div>
      <div class="status" id="status"><span id="status-ic"></span><span id="status-t"></span></div>
    </div>

    <div class="mnote" id="mnote" hidden><span data-ic="info"></span><span data-t="manualNote"></span></div>

    <button class="cta" id="cta"></button>
  </div></div>
  <footer data-t="foot"></footer>
</div>

<script>
(function(){
  var LANG='en', live=true, rec=true;
  function t(){return L[LANG];}
  function combo(){ return live&&rec?'full':(live&&!rec?'live':(!live&&rec?'recap':'manual')); }
  function paintStatic(){
    var d=t();
    document.querySelectorAll('[data-t]').forEach(function(el){var k=el.getAttribute('data-t'); if(d[k]!=null) el.textContent=d[k];});
    document.querySelectorAll('[data-ic]').forEach(function(el){var k=el.getAttribute('data-ic'); if(IC[k]) el.innerHTML=IC[k];});
    document.querySelector('.dev .hw').innerHTML=IC.hw;
    document.querySelector('.dev .st').innerHTML=IC.wifi+'<span>'+d.connected+'</span>';
  }
  function render(){
    var d=t(), c=combo();
    document.querySelector('[data-sw="live"]').classList.toggle('on',live);
    document.querySelector('[data-sw="rec"]').classList.toggle('on',rec);
    document.getElementById('row-live').classList.toggle('off',!live);
    document.getElementById('row-rec').classList.toggle('off',!rec);
    var card=document.getElementById('card'), isManual=(c==='manual');
    card.classList.toggle('manual',isManual);
    document.getElementById('c-ic').innerHTML = isManual?IC.hand:IC.ai;
    document.getElementById('c-name').textContent = isManual?d.manualName:d.name;
    document.getElementById('c-sub').textContent = isManual?d.manualSub:d.sub;
    document.getElementById('c-plus').style.display = isManual?'none':'';
    var st=document.getElementById('status-t'), sic=document.getElementById('status-ic');
    st.textContent = d['s_'+c]; sic.innerHTML = isManual?IC.hand:IC.play;
    document.getElementById('mnote').style.display = isManual?'flex':'none';
    var cta=document.getElementById('cta');
    cta.textContent = isManual?d.cta_manual:(c==='recap'?d.cta_rec:d.cta_coach);
  }
  document.querySelectorAll('[data-sw]').forEach(function(s){ s.addEventListener('click',function(){
    if(s.getAttribute('data-sw')==='live') live=!live; else rec=!rec; render();
  }); });
  document.querySelectorAll('#lang button').forEach(function(b){ b.addEventListener('click',function(){
    LANG=b.getAttribute('data-l'); document.querySelectorAll('#lang button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});
    paintStatic(); render();
  }); });
  paintStatic(); render();
})();
</script>
